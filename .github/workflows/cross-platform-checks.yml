name: Cross-platform checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debugger:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Enable macOS debugger authorization
        if: runner.os == 'macOS'
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          sudo /usr/sbin/dseditgroup -o edit -a "$(id -un)" -t user _developer
      - name: Restore formatter
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check src test samples
      - name: Test solution
        run: dotnet test DotDbg.slnx --nologo
